<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urlify.io - AI Media Extractor & Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-white font-sans flex flex-col justify-between relative overflow-x-hidden">

    <!-- Animated Background Orbs ✨ -->
    <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-indigo-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-4000"></div>

    <!-- Header 🌐 -->
    <header class="w-full py-6 px-8 flex justify-between items-center border-b border-white/10 backdrop-blur-md relative z-10">
        <div class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
            Urlify.io ⚡
        </div>
        <nav class="space-x-6 text-sm text-gray-300 hidden md:block">
            <a href="#" class="hover:text-blue-400 transition">Home</a>
            <a href="#features" class="hover:text-blue-400 transition">Features</a>
            <a href="#docs" class="hover:text-blue-400 transition">API Docs</a>
        </nav>
    </header>

    <!-- Main Content 🚀 -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 relative z-10">
        <div class="text-center max-w-2xl mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 leading-tight">
                Transform Links into Assets, Instantly 🛠️
            </h1>
            <p class="text-gray-300 text-base md:text-lg">
                Advanced engine to extract media from URLs or convert file formats on the fly.
            </p>
        </div>

        <!-- Interactive Tool Box 🎛️ -->
        <div class="w-full max-w-xl bg-white/5 backdrop-blur-2xl border border-white/10 p-6 md:p-8 rounded-2xl shadow-2xl">
            <div class="flex border-b border-white/10 mb-6">
                <button id="tab-url-btn" onclick="switchTab('url')" class="flex-1 pb-3 text-center font-semibold border-b-2 border-blue-500 text-blue-400 transition">
                    🔗 URL to Media
                </button>
                <button id="tab-upload-btn" onclick="switchTab('upload')" class="flex-1 pb-3 text-center font-semibold border-b-2 border-transparent text-gray-400 hover:text-white transition">
                    📤 Upload & Convert
                </button>
            </div>

            <div id="tab-url-content" class="space-y-4">
                <label class="block text-sm text-gray-300">Enter Web or Media URL:</label>
                <div class="flex gap-2">
                    <input type="url" placeholder="https://example.com/page" class="flex-grow bg-black/40 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition">
                    <button class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-medium transition shadow-lg shadow-blue-500/20">
                        Extract
                    </button>
                </div>
            </div>

            <div id="tab-upload-content" class="space-y-4 hidden">
                <label class="block text-sm text-gray-300">Upload Image or Video File:</label>
                <div class="border-2 border-dashed border-white/20 rounded-lg p-6 text-center hover:border-purple-500 transition cursor-pointer bg-black/20">
                    <p class="text-gray-300 text-sm mb-1">Drag & drop files here, or <span class="text-purple-400 underline">Browse</span></p>
                    <p class="text-xs text-gray-500">Supports PNG, JPG, MP4, WebP</p>
                </div>
                <button class="w-full bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-lg font-medium transition shadow-lg shadow-purple-500/20">
                    Generate Public URL
                </button>
            </div>
        </div>
    </main>

    <!-- Footer 📝 -->
    <footer class="w-full py-4 text-center text-xs text-gray-500 border-t border-white/10 relative z-10">
        &copy; 2026 Urlify.io. All rights reserved.
    </footer>

    <script>
        function switchTab(type) {
            const urlBtn = document.getElementById('tab-url-btn');
            const uploadBtn = document.getElementById('tab-upload-btn');
            const urlContent = document.getElementById('tab-url-content');
            const uploadContent = document.getElementById('tab-upload-content');

            if(type === 'url') {
                urlBtn.classList.add('border-blue-500', 'text-blue-400');
                urlBtn.classList.remove('border-transparent', 'text-gray-400');
                uploadBtn.classList.remove('border-blue-500', 'text-blue-400');
                uploadBtn.classList.add('border-transparent', 'text-gray-400');
                urlContent.classList.remove('hidden');
                uploadContent.classList.add('hidden');
            } else {
                uploadBtn.classList.add('border-blue-500', 'text-blue-400');
                uploadBtn.classList.remove('border-transparent', 'text-gray-400');
                urlBtn.classList.remove('border-blue-500', 'text-blue-400');
                urlBtn.classList.add('border-transparent', 'text-gray-400');
                uploadContent.classList.remove('hidden');
                urlContent.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
