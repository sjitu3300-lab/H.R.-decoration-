<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urlify.ai - AI Media Extractor & Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animated Background Gradient */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #09090b);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
        }
    </style>
</head>
<body class="animated-bg min-h-screen text-white font-sans flex flex-col justify-between">

    <!-- Header Section -->
    <header class="w-full py-6 px-8 flex justify-between items-center border-b border-white/10 backdrop-blur-md">
        <div class="text-2xl font-bold tracking-wider bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
            Urlify.ai ⚡
        </div>
        <nav class="space-x-6 text-sm text-gray-300 hidden md:block">
            <a href="#" class="hover:text-blue-400 transition">Home</a>
            <a href="#features" class="hover:text-blue-400 transition">Features</a>
            <a href="#about" class="hover:text-blue-400 transition">About</a>
        </nav>
    </header>

    <!-- Main Content / Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <div class="text-center max-w-2xl mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 leading-tight">
                All-in-One Media Extractor & Converter 🛠️
            </h1>
            <p class="text-gray-300 text-base md:text-lg">
                Paste any URL to extract images/videos or upload your media to convert formats instantly.
            </p>
        </div>

        <!-- Interactive Tool Box Card -->
        <div class="w-full max-w-xl bg-white/10 backdrop-blur-xl border border-white/20 p-6 md:p-8 rounded-2xl shadow-2xl">
            <!-- Tabs -->
            <div class="flex border-b border-white/10 mb-6">
                <button id="tab-url-btn" onclick="switchTab('url')" class="flex-1 pb-3 text-center font-semibold border-b-2 border-blue-500 text-blue-400 transition">
                    🔗 URL to Media
                </button>
                <button id="tab-upload-btn" onclick="switchTab('upload')" class="flex-1 pb-3 text-center font-semibold border-b-2 border-transparent text-gray-400 hover:text-white transition">
                    📤 Upload & Convert
                </button>
            </div>

            <!-- Tab 1: URL Input Form -->
            <div id="tab-url-content" class="space-y-4">
                <label class="block text-sm text-gray-300">Enter Website or Media URL:</label>
                <div class="flex gap-2">
                    <input type="url" placeholder="https://example.com/page" class="flex-grow bg-black/40 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    <button class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-medium transition shadow-lg">
                        Extract
                    </button>
                </div>
            </div>

            <!-- Tab 2: Upload Form (Hidden by default) -->
            <div id="tab-upload-content" class="space-y-4 hidden">
                <label class="block text-sm text-gray-300">Upload Image or Video:</label>
                <div class="border-2 border-dashed border-white/30 rounded-lg p-6 text-center hover:border-blue-500 transition cursor-pointer">
                    <p class="text-gray-300 text-sm mb-1">Drag & drop files here, or <span class="text-blue-400 underline">Browse</span></p>
                    <p class="text-xs text-gray-500">Supports PNG, JPG, MP4 (Max 50MB)</p>
                </div>
                <button class="w-full bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-lg font-medium transition shadow-lg">
                    Generate Public URL / Convert
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-gray-500 border-t border-white/10">
        &copy; 2026 Urlify.ai. Built for fast SEO ranking and performance.
    </footer>

    <!-- JavaScript for Tab Switching -->
    <script>
        function switchTab(type) {
            const urlBtn = document.getElementById('tab-url-btn');
            const uploadBtn = document.getElementById('tab-upload-btn');
            const urlContent = document.getElementById('tab-url-content');
            const uploadContent = document.getElementById('tab-upload-content');

            if(type === 'url') {
                urlBtn.classList.add('border-blue-500', 'text-blue-400');
                urlBtn.classList.remove('border-transparent', 'text-gray-400');
                uploadBtn.classList.remove('border-blue-500', 'text-blue-400');
                uploadBtn.classList.add('border-transparent', 'text-gray-400');

                urlContent.classList.remove('hidden');
                uploadContent.classList.add('hidden');
            } else {
                uploadBtn.classList.add('border-blue-500', 'text-blue-400');
                uploadBtn.classList.remove('border-transparent', 'text-gray-400');
                urlBtn.classList.remove('border-blue-500', 'text-blue-400');
                urlBtn.classList.add('border-transparent', 'text-gray-400');

                uploadContent.classList.remove('hidden');
                urlContent.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
