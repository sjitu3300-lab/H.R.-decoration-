<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Inder Paradise</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        /* Intro Loader */
        #intro-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #loader-title {
            font-size: clamp(2.5rem, 8vw, 7rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #fff;
            text-align: center;
        }

        /* Cloud Reveal Section */
        #cloud-reveal {
            height: 300vh;
            position: relative;
            background: #000;
        }
        .sticky-box {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-hotel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .clouds-content {
            position: absolute;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
        }
        .clouds-content h2 {
            font-size: clamp(2rem, 5vw, 5rem);
            margin-bottom: 15px;
        }
        .clouds-content p {
            color: #ccc;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        #white-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 3;
            clip-path: circle(0% at 50% 50%);
        }

        /* Normal Sections */
        .scene-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            border-top: 1px solid #222;
            padding: 0 10%;
        }
        .scene-section h2 {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- STAGE 1: Black Background Name -->
    <div id="intro-loader">
        <h1 id="loader-title">INDER PARADISE</h1>
    </div>

    <!-- STAGE 2: Scroll Reveal -->
    <section id="cloud-reveal">
        <div class="sticky-box">
            <!-- Hotel Background -->
            <div class="bg-hotel"></div>
            
            <!-- Center Text -->
            <div class="clouds-content" id="cloud-text-area">
                <p style="letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 10px; color: #d4af37;">Welcome To Luxury</p>
                <h2>Royal Heritage Experience</h2>
                <p>Didwana Road, Nagaur - Where elegance meets comfort.</p>
            </div>

            <!-- White Mask for Reveal -->
            <div id="white-mask"></div>
        </div>
    </section>

    <!-- STAGE 3: Next Scenes -->
    <section class="scene-section">
        <div>
            <h2>Exquisite Rooms & Suites</h2>
            <p style="color: #aaa; font-size: 1.2rem; max-width: 500px;">Designed for royalty, offering modern amenities with a traditional touch.</p>
        </div>
    </section>

    <!-- GSAP Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 1. Initial Loader Animation
        window.addEventListener('load', () => {
            let tl = gsap.timeline();
            tl.fromTo("#loader-title", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" })
              .to("#loader-title", { opacity: 0, duration: 0.8, delay: 0.5 })
              .to("#intro-loader", { display: "none", duration: 0.1 });
        });

        // 2. Scroll Reveal Animation
        let revealTl = gsap.timeline({
            scrollTrigger: {
                trigger: "#cloud-reveal",
                start: "top top",
                end: "+=250%",
                scrub: true,
                pin: true
            }
        });

        revealTl.to("#cloud-text-area", { y: -100, opacity: 0, duration: 1 }, 0)
                .to("#white-mask", { clipPath: "circle(100% at 50% 50%)", duration: 3 }, 0);
    </script>
</body>
        </html>
