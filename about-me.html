<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me - JL Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8f9fa; color: #111111; padding: 30px 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 25px; text-align: center; color: #111111; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #333333; }
    .form-control { width: 100%; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
    .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    textarea.form-control { resize: vertical; min-height: 120px; }
    .btn-save { width: 100%; padding: 12px; background: #111111; color: #ffffff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: background 0.3s; }
    .btn-save:hover { background: #2563eb; }
    .back-link { display: inline-block; margin-top: 20px; text-decoration: none; color: #2563eb; font-weight: 600; text-align: center; width: 100%; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="page-title">About Me (मेरे बारे में) 📝</h2>
    
    <form id="aboutMeForm" onsubmit="saveAboutMe(event)">
      <div class="form-group">
        <label>Professional Headline / Title 💼</label>
        <input type="text" id="headline" class="form-control" placeholder="उदा. Full Stack Developer / UI-UX Designer">
      </div>

      <div class="form-group">
        <label>Bio / Short Introduction ✍️</label>
        <textarea id="bio" class="form-control" placeholder="अपने बारे में कुछ पंक्तियाँ लिखें जो आपके पोर्टफोलियो पर दिखाई देंगी..."></textarea>
      </div>

      <div class="form-group">
        <label>Key Skills (कॉमा लगाकर लिखें) ⚡</label>
        <input type="text" id="skills" class="form-control" placeholder="उदा. JavaScript, React, Firebase, Python">
      </div>

      <button type="submit" class="btn-save">About Info सेव करें 💾</button>
    </form>

    <a href="profile.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Wapas Profile par jayein</a>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    function saveAboutMe(e) {
      e.preventDefault();
      const headline = document.getElementById("headline").value;
      const bio = document.getElementById("bio").value;
      const skills = document.getElementById("skills").value;

      // आप इसे लोकल स्टोरेज या फायरबेस डेटाबेस में सेव कर सकते हैं
      localStorage.setItem('user_headline', headline);
      localStorage.setItem('user_bio', bio);
      localStorage.setItem('user_skills', skills);

      alert("आपकी 'About Me' जानकारी सफलतापूर्वक सहेज ली गई है!");
      window.location.href = "profile.html";
    }
  </script>
</body>
</html>
