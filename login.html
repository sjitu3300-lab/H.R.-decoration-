<!DOCTYPE html>
<html b:css='false' b:js='false' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gdata/blender' xmlns:data='http://www.google.com/2005/gdata/data' xmlns:expr='http://www.google.com/2005/gdata/expr'>
<head>
    <meta charset='UTF-8'/>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
    <title>Jitendra Portfolio - Login &amp; Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src='https://cdn.tailwindcss.com'></script>
    <!-- FontAwesome Icons -->
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'/>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 3D Flip Container Setup */
        .flip-container {
            perspective: 1500px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .flipper {
            position: relative;
            width: 100%;
            height: 640px;
            transition: transform 0.9s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-container.flipped .flipper {
            transform: rotateY(180deg);
        }

        /* Front & Back Card Design (Clean Index.html Matching Style) */
        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 2.5rem;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* Input Fields */
        .embossed-input {
            width: 100%;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 14px 18px;
            color: #111111;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .embossed-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Center Top Icon Circle */
        .embossed-circle {
            width: 70px;
            height: 70px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border: 1px solid #e5e7eb;
            color: #2563eb;
            font-size: 1.6rem;
        }
        
        /* Action Circle Buttons (+ and Arrow) */
        .action-circle {
            width: 45px;
            height: 45px;
            background: #f3f4f6;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #e5e7eb;
            color: #2563eb;
            transition: all 0.3s ease;
        }
        .action-circle:hover {
            transform: scale(1.1);
            background-color: #111111;
            color: #ffffff;
        }

        /* Social Icons */
        .social-btn {
            width: 44px;
            height: 44px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4b5563;
            transition: all 0.3s;
            border: 1px solid #e5e7eb;
        }
        .social-btn:hover {
            background-color: #111111;
            color: #ffffff;
        }
    </style>
    <b:skin><![CDATA[/* Login Signup Skin */]]></b:skin>
</head>
<body>

    <div class='flip-container' id='flipCard'>
        <div class='flipper'>
            
            <!-- FRONT SIDE: LOGIN -->
            <div class='card-face card-front'>
                <div class='text-center space-y-3'>
                    <div class='embossed-circle'>
                        <i class='fa-solid fa-lock-keyhole'></i>
                    </div>
                    <h2 class='text-2xl font-extrabold text-slate-900 tracking-wide'>Welcome Back</h2>
                    <p class='text-xs text-slate-500'>Login to continue your journey</p>
                </div>

                <div class='space-y-4 my-auto'>
                    <div>
                        <label class='block text-xs font-semibold text-slate-600 mb-1.5'>Email Address</label>
                        <input type='email' placeholder='name@example.com' class='embossed-input'/>
                    </div>
                    <div>
                        <label class='block text-xs font-semibold text-slate-600 mb-1.5'>Password</label>
                        <div class='relative'>
                            <input type='password' placeholder='••••••••' class='embossed-input pr-10'/>
                            <i class='fa-solid fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm cursor-pointer'></i>
                        </div>
                    </div>
                    <div class='flex justify-between items-center text-xs text-slate-600 pt-1'>
                        <label class='flex items-center gap-2 cursor-pointer'>
                            <input type='checkbox' class='rounded border-slate-300 text-blue-600 focus:ring-0'/> Remember me
                        </label>
                        <a href='#' class='text-blue-600 hover:underline'>Forgot Password?</a>
                    </div>
                </div>

                <div class='space-y-4'>
                    <button class='w-full py-3.5 rounded-xl bg-[#111111] font-bold text-white hover:bg-blue-600 transition shadow-lg'>
                        LOGIN
                    </button>
                    
                    <div class='flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-500'>
                        <span>Don't have an account?</span>
                        <div onclick='toggleCard()' class='action-circle' title='Create Account'>
                            <i class='fa-solid fa-plus'></i>
                        </div>
                    </div>

                    <!-- Social Icons -->
                    <div class='flex justify-center gap-4 pt-1'>
                        <a href='#' class='social-btn'><i class='fa-brands fa-google'></i></a>
                        <a href='#' class='social-btn'><i class='fa-brands fa-facebook-f'></i></a>
                        <a href='#' class='social-btn'><i class='fa-brands fa-linkedin-in'></i></a>
                    </div>
                </div>
            </div>

            <!-- BACK SIDE: SIGN UP (CREATE ACCOUNT) -->
            <div class='card-face card-back'>
                <div class='text-center space-y-2'>
                    <div class='embossed-circle' style='color: #2563eb;'>
                        <i class='fa-solid fa-user-plus'></i>
                    </div>
                    <h2 class='text-2xl font-extrabold text-slate-900 tracking-wide'>Create Account</h2>
                    <p class='text-xs text-slate-500'>Start your journey with us</p>
                </div>

                <div class='space-y-3 my-auto'>
                    <div>
                        <label class='block text-xs font-semibold text-slate-600 mb-1'>Full Name</label>
                        <input type='text' placeholder='Jitendra Soni' class='embossed-input'/>
                    </div>
                    <div>
                        <label class='block text-xs font-semibold text-slate-600 mb-1'>Email Address</label>
                        <input type='email' placeholder='name@example.com' class='embossed-input'/>
                    </div>
                    <div>
                        <label class='block text-xs font-semibold text-slate-600 mb-1'>Password</label>
                        <input type='password' placeholder='••••••••' class='embossed-input'/>
                    </div>
                    <div>
                        <label class='block text-xs font-semibold text-slate-600 mb-1'>Confirm Password</label>
                        <input type='password' placeholder='••••••••' class='embossed-input'/>
                    </div>
                </div>

                <div class='space-y-4'>
                    <button class='w-full py-3.5 rounded-xl bg-[#111111] font-bold text-white hover:bg-blue-600 transition shadow-lg'>
                        CREATE ACCOUNT
                    </button>
                    
                    <div class='flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-500'>
                        <span>Already have an account?</span>
                        <div onclick='toggleCard()' class='action-circle' title='Back to Login'>
                            <i class='fa-solid fa-arrow-left'></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Hidden Blogger Section Tag -->
    <div style='display:none;'>
        <b:section id='main' showaddelement='no'>
            <b:widget id='Blog1' locked='true' title='Blog Posts' type='Blog'/>
        </b:section>
    </div>

    <!-- JavaScript for 3D Flip Action -->
    <script>
        function toggleCard() {
            const card = document.getElementById('flipCard');
            card.classList.toggle('flipped');
        }
    </script>
</body>
</html>
