<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Profile - JL Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- 🌐 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: #f8f9fa;
      color: #111111;
      padding: 20px 0;
    }

    /* 👤 Main Wrapper Matching Profile Page */
    .profile-wrapper {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    .profile-page-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      color: #111111;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* 📦 Cards Group & Header Card Style from Profile */
    .profile-card-group {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid #f3f4f6;
      margin-bottom: 20px;
    }

    /* 🖼️ Avatar Section */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
    }
    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f3f4f6;
      overflow: hidden;
      border: 2px solid #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .file-input-label {
      font-size: 0.85rem;
      color: #2563eb;
      font-weight: 600;
      cursor: pointer;
    }

    /* 📝 Form Controls */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e5e7eb;
      background-color: #f9fafb;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #111111;
      outline: none;
      transition: border-color 0.3s, background-color 0.3s;
    }
    .form-control:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    /* 🔘 Buttons Group */
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      border: none;
      font-size: 0.95rem;
    }
    .btn-save {
      background-color: #111111;
      color: #ffffff;
      transition: background 0.3s;
    }
    .btn-save:hover {
      background-color: #2563eb;
    }
    .btn-cancel {
      background-color: #f3f4f6;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-cancel:hover {
      background-color: #e5e7eb;
    }

    /* Top Back Link Style */
    .top-nav {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .back-link {
      text-decoration: none;
      color: #4b5563;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="profile-wrapper">
    
    <!-- Top Navigation Back Link -->
    <div class="top-nav">
      <a href="profile.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Profile</a>
    </div>

    <h2 class="profile-page-title"><i class="fa-regular fa-user" style="color: #2563eb;"></i> Manage Profile</h2>

    <div class="profile-card-group">
      <div class="avatar-section">
        <div class="avatar-circle">
          <img id="previewImg" src="https://via.placeholder.com/150" alt="Avatar">
        </div>
        <input type="file" id="imageUpload" accept="image/*" style="font-size: 0.85rem;">
      </div>

      <form id="manageProfileForm" onsubmit="saveProfileData(event)">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" class="form-control" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label>Middle Name</label>
          <input type="text" id="middleName" class="form-control" placeholder="Middle name">
        </div>
        <div class="form-group">
          <label>Surname</label>
          <input type="text" id="surname" class="form-control" placeholder="Surname">
        </div>
        <div class="form-group">
          <label>Mobile Number 📱</label>
          <input type="tel" id="mobile" class="form-control" placeholder="Mobile number">
        </div>
        <div class="form-group">
          <label>Date of Birth 📅</label>
          <input type="date" id="dob" class="form-control">
        </div>
        <div class="form-group">
          <label>Email ✉️</label>
          <input type="email" id="email" class="form-control" readonly>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-save">Save Changes 💾</button>
          <a href="profile.html" class="btn btn-cancel">Cancel ❌</a>
        </div>
      </form>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // 🖼️ Image Preview Logic
    const imageUpload = document.getElementById("imageUpload");
    let selectedImageFile = null;

    imageUpload.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        selectedImageFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("previewImg").src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        document.getElementById("email").value = user.email || "";
        if (user.displayName) {
          const nameParts = user.displayName.split(" ");
          document.getElementById("firstName").value = nameParts[0] || "";
          if (nameParts.length > 2) {
            document.getElementById("middleName").value = nameParts[1] || "";
            document.getElementById("surname").value = nameParts.slice(2).join(" ") || "";
          } else if (nameParts.length === 2) {
            document.getElementById("surname").value = nameParts[1] || "";
          }
        }
        if (user.photoURL) {
          document.getElementById("previewImg").src = user.photoURL;
        }
      } else {
        window.location.href = "login.html";
      }
    });

    function saveProfileData(e) {
      e.preventDefault();
      const user = firebase.auth().currentUser;
      const fName = document.getElementById("firstName").value;
      const mName = document.getElementById("middleName").value;
      const lName = document.getElementById("surname").value;
      
      const fullDisplayName = [fName, mName, lName].filter(Boolean).join(" ");

      if (user) {
        const newPhotoURL = user.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80";

        user.updateProfile({
          displayName: fullDisplayName,
          photoURL: newPhotoURL
        }).then(() => {
          alert("Profile updated successfully!");
          window.location.href = "profile.html";
        }).catch((error) => {
          alert("Error: " + error.message);
        });
      }
    }
  </script>
</body>
</html>
