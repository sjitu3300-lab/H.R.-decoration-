<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Profile - JL Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- 🌐 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
 * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: #f8f9fa;
      color: #111111;
      padding: 20px 0;
      transition: background 0.3s, color 0.3s;
    }
    body.dark-theme {
      background-color: #0a0a0a;
      color: #f3f4f6;
    }
    body.dark-theme .profile-card-group,
    body.dark-theme .user-header-card {
      background: #161616;
      border-color: #222222;
    }
    body.dark-theme .user-details h3,
    body.dark-theme .profile-page-title,
    body.dark-theme .profile-item {
      color: #f3f4f6;
    }
    body.dark-theme .profile-item:hover {
      background-color: #222222;
    }

    .profile-wrapper {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    .profile-page-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 25px;
    }
    .section-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b7280;
      margin: 25px 0 10px 5px;
    }
    .profile-card-group, .user-header-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 12px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid #f3f4f6;
      margin-bottom: 10px;
    }
    .user-header-card {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-details h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .user-details p {
      font-size: 0.85rem;
      color: #6b7280;
    }
    .profile-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      text-decoration: none;
      color: #1f2937;
      transition: background 0.2s;
      cursor: pointer;
    }
    .profile-item:hover {
      background-color: #f9fafb;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .item-left i {
      font-size: 1.1rem;
      color: #374151;
      width: 24px;
      text-align: center;
    }
    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #6b7280;
    }
    .divider {
      height: 1px;
      background-color: #f3f4f6;
      margin: 0 20px;
    }
    body.dark-theme .divider {
      background-color: #222222;
    }
</style>
</head>
<body>
  <div class="profile-wrapper">
    
    <!-- Top Back Navigation Link -->
    <a href="profile.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Wapas Profile par jayein</a>

    <h2 class="profile-page-title">Manage Profile 👤</h2>
    
    <div class="profile-card-group">
      <div class="avatar-section">
        <div class="avatar-circle">
          <img id="previewImg" src="https://via.placeholder.com/150" alt="Avatar">
        </div>
        <input type="file" id="imageUpload" accept="image/*" style="font-size: 0.85rem;">
      </div>

      <form id="manageProfileForm" onsubmit="saveProfileData(event)">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" class="form-control" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label>Middle Name</label>
          <input type="text" id="middleName" class="form-control" placeholder="Middle name">
        </div>
        <div class="form-group">
          <label>Surname</label>
          <input type="text" id="surname" class="form-control" placeholder="Surname">
        </div>
        <div class="form-group">
          <label>Mobile Number 📱</label>
          <input type="tel" id="mobile" class="form-control" placeholder="Mobile number">
        </div>
        <div class="form-group">
          <label>Date of Birth 📅</label>
          <input type="date" id="dob" class="form-control">
        </div>
        <div class="form-group">
          <label>Email ✉️</label>
          <input type="email" id="email" class="form-control" readonly>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-save">Save 💾</button>
          <a href="profile.html" class="btn btn-cancel">Cancel ❌</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // 🖼️ Image Preview Logic[cite: 1]
    const imageUpload = document.getElementById("imageUpload");
    let selectedImageFile = null;

    imageUpload.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        selectedImageFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("previewImg").src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        document.getElementById("email").value = user.email || "";
        if (user.displayName) {
          const nameParts = user.displayName.split(" ");
          document.getElementById("firstName").value = nameParts[0] || "";
          if (nameParts.length > 2) {
            document.getElementById("middleName").value = nameParts[1] || "";
            document.getElementById("surname").value = nameParts.slice(2).join(" ") || "";
          } else if (nameParts.length === 2) {
            document.getElementById("surname").value = nameParts[1] || "";
          }
        }
        if (user.photoURL) {
          document.getElementById("previewImg").src = user.photoURL;
        }
      } else {
        window.location.href = "login.html";
      }
    });

    function saveProfileData(e) {
      e.preventDefault();
      const user = firebase.auth().currentUser;
      const fName = document.getElementById("firstName").value;
      const mName = document.getElementById("middleName").value;
      const lName = document.getElementById("surname").value;
      
      const fullDisplayName = [fName, mName, lName].filter(Boolean).join(" ");

      if (user) {
        const newPhotoURL = document.getElementById("previewImg").src;

        user.updateProfile({
          displayName: fullDisplayName,
          photoURL: newPhotoURL
        }).then(() => {
          alert("Profile updated successfully!");
          window.location.href = "profile.html";
        }).catch((error) => {
          alert("Error: " + error.message);
        });
      }
    }
  </script>
</body>
</html>
