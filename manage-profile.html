<!DOCTYPE html>
<html b:css='false' b:js='false' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gdata/blender' xmlns:data='http://www.google.com/2005/gdata/data' xmlns:expr='http://www.google.com/2005/gdata/expr'>
<head>
  <meta charset='UTF-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
  <title>Manage Profile - JL Portfolio</title>
  <link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap' rel='stylesheet'/>
  <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'/>
  
  <!-- 🌐 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: #f8f9fa;
      color: #111111;
      padding: 20px 0;
      transition: background 0.3s, color 0.3s;
    }
    body.dark-theme {
      background-color: #0a0a0a;
      color: #f3f4f6;
    }
    body.dark-theme .profile-card-group,
    body.dark-theme .user-header-card {
      background: #161616;
      border-color: #222222;
    }
    body.dark-theme .user-details h3,
    body.dark-theme .profile-page-title,
    body.dark-theme .profile-item {
      color: #f3f4f6;
    }

    .profile-wrapper {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    .profile-page-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .section-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b7280;
      margin: 25px 0 10px 5px;
    }
    .profile-card-group, .user-header-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid #f3f4f6;
      margin-bottom: 10px;
    }
    .user-header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2563eb;
    }
    
    /* Form fields styled as profile rows */
    .form-row {
      margin-bottom: 15px;
    }
    .form-row:last-child {
      margin-bottom: 0;
    }
    .form-row label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 5px;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #111111;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      border: none;
      font-size: 0.95rem;
    }
    .btn-save {
      background-color: #111111;
      color: #ffffff;
      transition: background 0.2s;
    }
    .btn-save:hover {
      background-color: #2563eb;
    }
    .btn-cancel {
      background-color: #f3f4f6;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-cancel:hover {
      background-color: #e5e7eb;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #4b5563;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    .back-link:hover {
      color: #2563eb;
    }
    .divider {
      height: 1px;
      background-color: #f3f4f6;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class='profile-wrapper'>
    <a href='profile.html' class='back-link'><i class='fa-solid fa-arrow-left'></i> Wapas Profile par jayein</a>
    
    <h2 class='profile-page-title'>Manage Profile 👤</h2>

    <!-- 🖼️ Avatar Upload Section -->
    <div class='user-header-card' style="justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <img id='previewImg' src='https://via.placeholder.com/150' alt='User Avatar' class='user-avatar'/>
        <div>
          <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 4px;">Profile Photo</h3>
          <p style="font-size: 0.8rem; color: #6b7280;">Nayi photo select karein</p>
        </div>
      </div>
      <input type="file" id="imageUpload" accept="image/*" style="font-size: 0.8rem; max-width: 130px;">
    </div>

    <!-- 📝 Profile Details Form Group -->
    <div class='section-label'>Personal Details</div>
    <div class='profile-card-group'>
      <form id="manageProfileForm" onsubmit="saveProfileData(event)">
        <div class='form-row'>
          <label>First Name</label>
          <input type="text" id="firstName" class="form-control" placeholder="First name" required>
        </div>
        <div class='divider'></div>
        <div class='form-row'>
          <label>Middle Name</label>
          <input type="text" id="middleName" class="form-control" placeholder="Middle name">
        </div>
        <div class='divider'></div>
        <div class='form-row'>
          <label>Surname</label>
          <input type="text" id="surname" class="form-control" placeholder="Surname">
        </div>
        <div class='divider'></div>
        <div class='form-row'>
          <label>Mobile Number 📱</label>
          <input type="tel" id="mobile" class="form-control" placeholder="Mobile number">
        </div>
        <div class='divider'></div>
        <div class='form-row'>
          <label>Date of Birth 📅</label>
          <input type="date" id="dob" class="form-control">
        </div>
        <div class='divider'></div>
        <div class='form-row'>
          <label>Email ✉️️</label>
          <input type="email" id="email" class="form-control" readonly>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-save">Save 💾</button>
          <a href="profile.html" class="btn btn-cancel">Cancel ❌</a>
        </div>
      </form>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // 🖼️ Image Preview Logic[cite: 1]
    const imageUpload = document.getElementById("imageUpload");
    let selectedImageFile = null;

    imageUpload.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        selectedImageFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("previewImg").src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        document.getElementById("email").value = user.email || "";
        if (user.displayName) {
          const nameParts = user.displayName.split(" ");
          document.getElementById("firstName").value = nameParts[0] || "";
          if (nameParts.length > 2) {
            document.getElementById("middleName").value = nameParts[1] || "";
            document.getElementById("surname").value = nameParts.slice(2).join(" ") || "";
          } else if (nameParts.length === 2) {
            document.getElementById("surname").value = nameParts[1] || "";
          }
        }
        if (user.photoURL) {
          document.getElementById("previewImg").src = user.photoURL;
        }
      } else {
        window.location.href = "login.html";
      }
    });

    function saveProfileData(e) {
      e.preventDefault();
      const user = firebase.auth().currentUser;
      const fName = document.getElementById("firstName").value;
      const mName = document.getElementById("middleName").value;
      const lName = document.getElementById("surname").value;
      
      const fullDisplayName = [fName, mName, lName].filter(Boolean).join(" ");

      if (user) {
        const newPhotoURL = document.getElementById("previewImg").src;

        user.updateProfile({
          displayName: fullDisplayName,
          photoURL: newPhotoURL
        }).then(() => {
          alert("Profile updated successfully!");
          window.location.href = "profile.html";
        }).catch((error) => {
          alert("Error: " + error.message);
        });
      }
    }
  </script>
</body>
</html>
