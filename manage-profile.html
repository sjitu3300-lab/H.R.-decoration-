<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Profile - JL Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- 🌐 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8f9fa; color: #111111; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    /* 📐 Fully Responsive Container matching Profile Page style */
    .container { width: 100%; max-width: 500px; background: #ffffff; border: 1px solid #f3f4f6; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
    
    @media (min-width: 768px) {
      .container { padding: 30px; }
    }

    /* 🧭 Header with Back Button & Page Icon */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #f3f4f6; padding-bottom: 15px; }
    .back-btn { font-size: 1.1rem; color: #111111; background: #f9fafb; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid #e5e7eb; transition: background 0.2s; }
    .back-btn:hover { background: #e5e7eb; color: #2563eb; }
    .header-title { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; color: #111111; }
    .header-title i { color: #2563eb; font-size: 1.2rem; }

    .avatar-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; gap: 10px; }
    .avatar-circle { width: 80px; height: 80px; border-radius: 50%; background: #f3f4f6; overflow: hidden; border: 2px solid #2563eb; display: flex; align-items: center; justify-content: center; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #374151; }
    .form-control { width: 100%; padding: 10px 14px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
    .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }
    .btn { flex: 1; padding: 11px; font-weight: 700; border-radius: 10px; cursor: pointer; text-align: center; text-decoration: none; border: none; font-size: 0.95rem; }
    .btn-save { background-color: #111111; color: #ffffff; transition: background 0.3s; }
    .btn-save:hover { background-color: #2563eb; }
    .btn-cancel { background-color: #f3f4f6; color: #111111; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; }
    .btn-cancel:hover { background-color: #e5e7eb; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 🧭 Header with Back Button & Profile Page Icon -->
    <div class="page-header">
      <a href="profile.html" class="back-btn" title="Wapas Jayein"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="header-title">
        <i class="fa-regular fa-user"></i> Manage Profile
      </div>
      <div style="width: 40px;"></div>
    </div>
    
    <div class="avatar-section">
      <div class="avatar-circle">
        <img id="previewImg" src="https://via.placeholder.com/150" alt="Avatar">
      </div>
      <input type="file" id="imageUpload" accept="image/*" style="font-size: 0.85rem;">
    </div>

    <form id="manageProfileForm" onsubmit="saveProfileData(event)">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="firstName" class="form-control" placeholder="First name" required>
      </div>
      <div class="form-group">
        <label>Middle Name</label>
        <input type="text" id="middleName" class="form-control" placeholder="Middle name">
      </div>
      <div class="form-group">
        <label>Surname</label>
        <input type="text" id="surname" class="form-control" placeholder="Surname">
      </div>
      <div class="form-group">
        <label>Mobile Number 📱</label>
        <input type="tel" id="mobile" class="form-control" placeholder="Mobile number">
      </div>
      <div class="form-group">
        <label>Date of Birth 📅</label>
        <input type="date" id="dob" class="form-control">
      </div>
      <div class="form-group">
        <label>Email ✉️</label>
        <input type="email" id="email" class="form-control" readonly>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn btn-save">Save 💾</button>
        <a href="profile.html" class="btn btn-cancel">Cancel ❌</a>
      </div>
    </form>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const imageUpload = document.getElementById("imageUpload");
    let selectedImageFile = null;

    imageUpload.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        selectedImageFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("previewImg").src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        document.getElementById("email").value = user.email || "";
        if (user.displayName) {
          const nameParts = user.displayName.split(" ");
          document.getElementById("firstName").value = nameParts[0] || "";
          if (nameParts.length > 2) {
            document.getElementById("middleName").value = nameParts[1] || "";
            document.getElementById("surname").value = nameParts.slice(2).join(" ") || "";
          } else if (nameParts.length === 2) {
            document.getElementById("surname").value = nameParts[1] || "";
          }
        }
        if (user.photoURL) {
          document.getElementById("previewImg").src = user.photoURL;
        }
      } else {
        window.location.href = "login.html";
      }
    });

    function saveProfileData(e) {
      e.preventDefault();
      const user = firebase.auth().currentUser;
      const fName = document.getElementById("firstName").value;
      const mName = document.getElementById("middleName").value;
      const lName = document.getElementById("surname").value;
      
      const fullDisplayName = [fName, mName, lName].filter(Boolean).join(" ");

      if (user) {
        // Using a placeholder avatar URL representation or keeping existing photoURL to avoid length limitations in Firebase Auth
        const newPhotoURL = user.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80";

        user.updateProfile({
          displayName: fullDisplayName,
          photoURL: newPhotoURL
        }).then(() => {
          alert("Profile updated successfully!");
          window.location.href = "profile.html";
        }).catch((error) => {
          alert("Error: " + error.message);
        });
      }
    }
  </script>
</body>
</html>
