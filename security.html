<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password & Security - JL Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8f9fa; color: #111111; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    /* 📐 Fully Responsive Container */
    .container { width: 100%; max-width: 600px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    
    @media (min-width: 768px) {
      .container { padding: 30px; }
    }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid #f3f4f6; padding-bottom: 15px; }
    .back-btn { font-size: 1.1rem; color: #111111; background: #f3f4f6; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: background 0.2s; }
    .back-btn:hover { background: #e5e7eb; color: #2563eb; }
    .header-title { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; color: #111111; }
    .header-title i { color: #2563eb; font-size: 1.3rem; }

    .section-box { margin-bottom: 20px; padding: 16px; background: #f9fafb; border-radius: 14px; border: 1px solid #e5e7eb; }
    .section-box h3 { font-size: 0.95rem; margin-bottom: 10px; color: #111111; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .section-box h3 i { color: #2563eb; }
    
    .form-control { width: 100%; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; margin-bottom: 12px; outline: none; transition: border-color 0.3s; }
    .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    
    .btn { width: 100%; padding: 12px; background: #111111; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.3s; font-size: 0.95rem; }
    .btn:hover { background: #2563eb; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 🧭 Header -->
    <div class="page-header">
      <a href="profile.html" class="back-btn" title="Wapas Jayein"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="header-title">
        <i class="fa-solid fa-shield-halved"></i> Password & Security
      </div>
      <div style="width: 40px;"></div>
    </div>
    
    <!-- 🔑 Change Password with Email OTP Verification -->
    <div class="section-box">
      <h3><i class="fa-regular fa-lock"></i> Change Password & OTP Verification</h3>
      <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 10px;">सुरक्षित बदलाव के लिए ईमेल पर OTP प्राप्त करें।</p>
      
      <button onclick="sendOtp()" id="sendOtpBtn" class="btn" style="margin-bottom: 10px;">Email par OTP bhejein ✉️</button>
      
      <div id="otpSection" class="hidden">
        <input type="text" id="otpInput" class="form-control" placeholder="6-digit OTP enter karein">
        <input type="password" id="newPassword" class="form-control" placeholder="Naya password (min 6 characters)">
        <button onclick="verifyAndChangePassword()" class="btn" style="background: #2563eb;">Verify aur Password Update karein 🔒</button>
      </div>
    </div>

    <!-- 🛡️ Two-Factor Authentication (2FA) -->
    <div class="section-box">
      <h3><i class="fa-solid fa-user-shield"></i> Two-Factor Authentication (2FA)</h3>
      <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 10px;">लॉगिन के समय अतिरिक्त सुरक्षा के लिए 2FA सक्रिय करें।</p>
      <button onclick="toggle2FA()" id="btn2FA" class="btn" style="background: #2563eb;">2FA Enable करें</button>
    </div>

    <!-- 📱 Active Sessions -->
    <div class="section-box">
      <h3><i class="fa-solid fa-laptop-code"></i> Where You're Logged In</h3>
      <div id="deviceList" style="font-size: 0.85rem; color: #374151; background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb;">
        <i class="fa-solid fa-circle-check" style="color: #10b981;"></i> Active Session: <span id="browserInfo">लोड हो रहा है...</span>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    let generatedOtp = "";

    function sendOtp() {
      const user = firebase.auth().currentUser;
      if (user) {
        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
        alert(`[Demo OTP]: ${user.email} par OTP bheja gaya hai: ${generatedOtp}`);
        document.getElementById("otpSection").classList.remove("hidden");
        document.getElementById("sendOtpBtn").innerText = "OTP Dobara Bhejein";
      }
    }

    function verifyAndChangePassword() {
      const user = firebase.auth().currentUser;
      const enteredOtp = document.getElementById("otpInput").value;
      const newPass = document.getElementById("newPassword").value;

      if (enteredOtp !== generatedOtp) {
        alert("Galat OTP! Kripya sahi OTP enter karein.");
        return;
      }

      if (user && newPass.length >= 6) {
        user.updatePassword(newPass).then(() => {
          alert("OTP verified! Password safaltapurvak update ho gaya!");
          document.getElementById("newPassword").value = "";
          document.getElementById("otpInput").value = "";
          document.getElementById("otpSection").classList.add("hidden");
        }).catch((error) => {
          alert("Error: " + error.message);
        });
      } else {
        alert("Kripya kam se kam 6 aksharon ka valid password enter karein.");
      }
    }

    function toggle2FA() {
      const btn = document.getElementById("btn2FA");
      if (btn.innerText.includes("Enable")) {
        btn.innerText = "2FA Disable करें";
        btn.style.background = "#dc2626";
        alert("Two-Factor Authentication safaltapurvak chalu kar diya gaya hai!");
      } else {
        btn.innerText = "2FA Enable करें";
        btn.style.background = "#2563eb";
        alert("Two-Factor Authentication band kar diya gaya hai.");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const ua = navigator.userAgent;
      let deviceDetails = "Desktop / Mobile Browser";
      if (ua.includes("Chrome")) deviceDetails = "Google Chrome (Active Session)";
      else if (ua.includes("Firefox")) deviceDetails = "Mozilla Firefox";
      else if (ua.includes("Safari")) deviceDetails = "Apple Safari";
      document.getElementById("browserInfo").innerText = deviceDetails;
    });
  </script>
</body>
</html>
