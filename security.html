<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password & Security - JL Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8f9fa; color: #111111; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    /* 📐 Fully Responsive Container matching Profile Page style */
    .container { width: 100%; max-width: 500px; background: #ffffff; border: 1px solid #f3f4f6; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
    
    @media (min-width: 768px) {
      .container { padding: 30px; }
    }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid #f3f4f6; padding-bottom: 15px; }
    .back-btn { font-size: 1.1rem; color: #111111; background: #f9fafb; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid #e5e7eb; transition: background 0.2s; }
    .back-btn:hover { background: #e5e7eb; color: #2563eb; }
    .header-title { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; color: #111111; }
    .header-title i { color: #2563eb; font-size: 1.2rem; }

    .section-box { margin-bottom: 20px; padding: 16px; background: #f9fafb; border-radius: 14px; border: 1px solid #e5e7eb; }
    .section-box h3 { font-size: 0.95rem; margin-bottom: 10px; color: #111111; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .section-box h3 i { color: #2563eb; }
    
    .form-control { width: 100%; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; margin-bottom: 12px; outline: none; transition: border-color 0.3s; }
    .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    
    .btn { width: 100%; padding: 12px; background: #111111; color: #ffffff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: background 0.3s; font-size: 0.95rem; text-align: center; }
    .btn:hover { background: #2563eb; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 🧭 Header with Back Button & Profile Page Icon -->
    <div class="page-header">
      <a href="profile.html" class="back-btn" title="Wapas Jayein"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="header-title">
        <i class="fa-regular fa-lock"></i> Password & Security
      </div>
      <div style="width: 40px;"></div>
    </div>
    
    <!-- 🔑 Password Change & Gmail Link Section -->
    <div class="section-box">
      <h3><i class="fa-regular fa-envelope"></i> Password Change & Gmail Link</h3>
      <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 12px;">Manage-profile me save ki gayi Gmail par password reset link bheja jayega.</p>
      <button onclick="sendPasswordResetLink()" class="btn" style="background: #2563eb;">Gmail par Password Link Bhejein ✉️</button>
    </div>

    <!-- 🛡️ Two-Factor Authentication (2FA) with Password & OTP -->
    <div class="section-box">
      <h3><i class="fa-solid fa-shield-halved"></i> Two-Factor Authentication (2FA)</h3>
      <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 12px;">अकाउंट की अतिरिक्त सुरक्षा के लिए 2FA सक्रिय करें।</p>
      
      <div id="faSetupSection">
        <button onclick="request2faOtp()" id="btn2FA" class="btn" style="background: #2563eb;">2FA Enable karne ke liye OTP bhejein 🛡️</button>
      </div>

      <div id="faVerifyBox" class="hidden" style="margin-top: 10px;">
        <input type="password" id="confirmPassword" class="form-control" placeholder="Apna current password enter karein">
        <input type="text" id="faOtpInput" class="form-control" placeholder="Gmail par prapt 6-digit OTP enter karein">
        <button onclick="verifyAndEnable2FA()" class="btn" style="background: #10b981;">2FA Verify aur Complete karein ✅</button>
      </div>
    </div>

    <!-- 📱 Active Sessions -->
    <div class="section-box">
      <h3><i class="fa-solid fa-laptop-code"></i> Where You're Logged In</h3>
      <div id="deviceList" style="font-size: 0.85rem; color: #374151; background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb;">
        <i class="fa-solid fa-circle-check" style="color: #10b981;"></i> Active Session: <span id="browserInfo">लोड हो रहा है...</span>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    // ✉️ Send Password Reset Link to Saved Gmail from profile
    function sendPasswordResetLink() {
      const user = firebase.auth().currentUser;
      if (user && user.email) {
        firebase.auth().sendPasswordResetEmail(user.email).then(() => {
          alert(`Password reset link aapki saved Gmail (${user.email}) par safaltapurvak bhej diya gaya hai!`);
        }).catch((error) => {
          alert("Error: " + error.message);
        });
      } else {
        alert("User email nahi mili.");
      }
    }

    let generated2faOtp = "";

    // 🛡️ Request OTP for 2FA
    function request2faOtp() {
      const user = firebase.auth().currentUser;
      if (user && user.email) {
        generated2faOtp = Math.floor(100000 + Math.random() * 900000).toString();
        alert(`[2FA Security OTP]: ${user.email} par OTP bheja gaya hai: ${generated2faOtp}`);
        document.getElementById("faVerifyBox").classList.remove("hidden");
        document.getElementById("btn2FA").innerText = "OTP Dobara Bheja Gaya";
      }
    }

    // ✅ Verify Password and OTP to Complete 2FA
    function verifyAndEnable2FA() {
      const password = document.getElementById("confirmPassword").value;
      const enteredOtp = document.getElementById("faOtpInput").value;
      const user = firebase.auth().currentUser;

      if (!password) {
        alert("Kripya apna current password enter karein.");
        return;
      }

      if (enteredOtp !== generated2faOtp) {
        alert("Galat OTP! Kripya sahi OTP enter karein.");
        return;
      }

      const credential = firebase.auth.EmailAuthProvider.credential(user.email, password);
      user.reauthenticateWithCredential(credential).then(() => {
        alert("Password verified aur Two-Factor Authentication (2FA) safaltapurvak activate ho gaya hai!");
        document.getElementById("faVerifyBox").classList.add("hidden");
        document.getElementById("btn2FA").innerText = "2FA Activated (Enabled) ✓";
        document.getElementById("btn2FA").style.background = "#10b981";
        document.getElementById("btn2FA").disabled = true;
      }).catch((error) => {
        alert("Authentication Error: Password galat ho sakta hai - " + error.message);
      });
    }

    // 📱 Active Device Detection
    window.addEventListener('DOMContentLoaded', () => {
      const ua = navigator.userAgent;
      let deviceDetails = "Desktop / Mobile Browser";
      if (ua.includes("Chrome")) deviceDetails = "Google Chrome (Active Session)";
      else if (ua.includes("Firefox")) deviceDetails = "Mozilla Firefox";
      else if (ua.includes("Safari")) deviceDetails = "Apple Safari";
      document.getElementById("browserInfo").innerText = deviceDetails;
    });
  </script>
</body>
</html>
