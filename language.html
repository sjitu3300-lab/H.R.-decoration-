<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Settings - JL Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8f9fa; color: #111111; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 500px; background: #ffffff; border: 1px solid #f3f4f6; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
    @media (min-width: 768px) { .container { padding: 30px; } }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #f3f4f6; padding-bottom: 15px; }
    .back-btn { font-size: 1.1rem; color: #111111; background: #f9fafb; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid #e5e7eb; transition: background 0.2s; }
    .back-btn:hover { background: #e5e7eb; color: #2563eb; }
    .header-title { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; color: #111111; }
    .header-title i { color: #2563eb; font-size: 1.2rem; }

    /* Search Bar */
    .search-box { position: relative; margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 12px 15px 12px 42px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
    .search-box input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 1rem; }

    .lang-list { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; padding-right: 4px; margin-bottom: 20px; }
    .lang-option { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #f9fafb; border-radius: 12px; border: 1px solid #e5e7eb; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
    .lang-option:hover { background-color: #f3f4f6; border-color: #2563eb; }
    .lang-option.selected { border-color: #2563eb; background-color: rgba(37, 99, 235, 0.04); }
    .lang-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; color: #111111; }
    
    .radio-circle { width: 18px; height: 18px; border: 2px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .lang-option.selected .radio-circle { border-color: #2563eb; }
    .lang-option.selected .radio-circle::after { content: ""; width: 8px; height: 8px; background: #2563eb; border-radius: 50%; display: block; }
    
    .btn-save { width: 100%; padding: 12px; background: #111111; color: #ffffff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: background 0.3s; font-size: 0.95rem; text-align: center; }
    .btn-save:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 🧭 Header with Back Button & Page Icon -->
    <div class="page-header">
      <a href="profile.html" class="back-btn" title="Wapas Jayein"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="header-title">
        <i class="fa-solid fa-globe"></i> Language Settings
      </div>
      <div style="width: 40px;"></div>
    </div>
    
    <!-- 🔍 Search Bar -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="langSearch" placeholder="Bhasha khojein (Search language)..." onkeyup="filterLanguages()">
    </div>

    <!-- 🌐 Language List -->
    <div class="lang-list" id="langContainer">
      <div class="lang-option selected" onclick="selectLanguage('hi', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> हिन्दी (Hindi)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('en', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> English</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('es', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> Español (Spanish)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('fr', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> Français (French)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('de', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> Deutsch (German)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('zh', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> 中文 (Mandarin Chinese)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('ja', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> 日本語 (Japanese)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('ar', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> العربية (Arabic)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('ru', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> Русский (Russian)</div>
        <div class="radio-circle"></div>
      </div>
      <div class="lang-option" onclick="selectLanguage('pt', this)">
        <div class="lang-info"><i class="fa-solid fa-language" style="color: #2563eb;"></i> Português (Portuguese)</div>
        <div class="radio-circle"></div>
      </div>
    </div>

    <button onclick="saveLanguage()" class="btn-save">Bhasha Save Karein 💾</button>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTRJbK7sDABJpLH5t9Eqo3_O-AhR_dX1Y",
      authDomain: "jl-portfolio-auth.firebaseapp.com",
      projectId: "jl-portfolio-auth",
      storageBucket: "jl-portfolio-auth.firebasestorage.app",
      messagingSenderId: "323080007478",
      appId: "1:323080007478:web:284cd85b3b3f141e350d97"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    let selectedLangCode = 'hi';

    function selectLanguage(code, element) {
      selectedLangCode = code;
      const options = document.querySelectorAll('.lang-option');
      options.forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');
    }

    function filterLanguages() {
      const query = document.getElementById("langSearch").value.toLowerCase();
      const options = document.querySelectorAll(".lang-option");

      options.forEach(opt => {
        const text = opt.innerText.toLowerCase();
        if (text.includes(query)) {
          opt.style.display = "flex";
        } else {
          opt.style.display = "none";
        }
      });
    }

    function saveLanguage() {
      localStorage.setItem('app_language', selectedLangCode);
      alert(`Bhasha safaltapurvak ${selectedLangCode.toUpperCase()} mein set kar di gayi hai!`);
      window.location.href = "profile.html";
    }
  </script>
</body>
</html>
